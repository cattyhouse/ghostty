name: Build macOS app (arm64, unsigned)

# Minimal, self-contained build of a macOS arm64 Ghostty.app for local manual
# testing on a real machine.
#
# Why this exists instead of reusing release-tip.yml: upstream's macOS jobs run
# on self-hosted runners (namespace-profile-*) and depend on Cachix, Apple
# signing certificates and notarization credentials, none of which exist in a
# fork. This workflow uses a plain GitHub-hosted arm64 runner, the same zig
# version upstream pins (flake.nix -> 0.16.0), and the Xcode project's
# existing ReleaseLocal configuration, which is ad-hoc signed and carries
# com.apple.security.cs.disable-library-validation so the app can load the
# GhosttyKit.xcframework that we just built locally.
#
# The result is NOT signed, notarized or notarization-stapled. It is only
# intended to be run locally on the machine that downloads it.

on:
  push:
    branches:
      - 'patch/**'
    paths:
      - 'src/**'
      - 'macos/**'
      - 'pkg/**'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/build-macos-app.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 is the arm64 (Apple Silicon) image. macos-26-intel / -large are
    # x64 and are deliberately not used.
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ghostty derives its build number from the commit count.
          fetch-depth: 0

      - name: Install zig
        # Same version upstream pins in flake.nix. Installed directly rather
        # than through nix so the workflow needs no Cachix credentials.
        run: |
          set -euo pipefail
          ZIG_VERSION=0.16.0
          curl -fsSL -o zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          tar xJf zig.tar.xz
          echo "$PWD/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Cache zig build
        # Keyed on the dependency manifest only, so that editing sources still
        # reuses the cached dependency compilation. Note build.zig.zon.lock is
        # generated by the build, so it only contributes a hash from the second
        # run onwards; restore-keys covers that first transition.
        #
        # `.zig-cache` is the local cache in the workspace; `~/.cache/zig` is
        # the global cache, which is where Zig keeps extracted dependencies
        # and compiler artifacts. Both matter for build time.
        #
        # Build outputs (zig-out, macos/GhosttyKit.xcframework) are
        # deliberately not cached: they are cheap to regenerate and caching
        # them risks serving a stale app.
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-arm64-${{ hashFiles('build.zig.zon', 'build.zig.zon.lock', 'flake.lock') }}
          restore-keys: |
            zig-${{ runner.os }}-arm64-

      - name: Toolchain versions
        run: |
          set -euo pipefail
          zig version
          xcodebuild -version
          sw_vers

      - name: Build GhosttyKit (Zig)
        # These are the same flags upstream's build-macos job uses. Do not add
        # -Demit-xcframework=false: the Xcode project links
        # GhosttyKit.xcframework out of zig-out, so the xcframework must be
        # produced here. Metal shaders are compiled by the Metal toolchain
        # from the selected Xcode, so this step must not run inside nix.
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast -Demit-macos-app=false

      - name: Verify GhosttyKit
        # The xcframework is written to macos/GhosttyKit.xcframework (see
        # GhosttyXCFramework.init, .out_path), which is where the Xcode
        # project's file reference resolves to. It is NOT under zig-out.
        run: |
          set -euo pipefail
          test -d macos/GhosttyKit.xcframework
          ls -la macos/GhosttyKit.xcframework
          echo "--- resources ---"
          ls -la zig-out/share

      - name: Build Ghostty.app
        working-directory: macos
        # ReleaseLocal is ad-hoc signed (CODE_SIGN_IDENTITY "-") with an empty
        # DEVELOPMENT_TEAM. The overrides make that explicit so the build does
        # not depend on any signing certificate being present on the runner.
        run: |
          set -euo pipefail
          xcodebuild -target Ghostty -configuration ReleaseLocal \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILATION_CACHE_CAS_PATH="$HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex" \
            COMPILATION_CACHE_KEEP_CAS_DIRECTORY=YES

      - name: Stamp Info.plist
        # Mark the build so it cannot be confused with an official tip build.
        env:
          GHOSTTY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          PLIST="macos/build/ReleaseLocal/Ghostty.app/Contents/Info.plist"
          test -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :GhosttyCommit $GHOSTTY_COMMIT" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString patched-$GHOSTTY_COMMIT" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 0" "$PLIST"
          # No update feed and no automatic checks: this build is unsigned and
          # must never try to replace itself with an official build.
          /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :SUEnableAutomaticChecks" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :GhosttyCommit" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"

      # Stamping the Info.plist above invalidates the signature that xcodebuild
      # just made, because the signature seals that file. Upstream fixes this by
      # re-signing with their real certificate in a later step; here we re-sign
      # ad-hoc, reusing the exact entitlements xcodebuild applied (which include
      # com.apple.security.cs.disable-library-validation, required to load the
      # locally built GhosttyKit).
      #
      # Order matters: nested code must be signed from the inside out, otherwise
      # signing a container invalidates the children it already sealed.
      #
      # The strip step below must run before this re-sign: stripping rewrites the
      # main executable and would invalidate a signature made earlier. The later
      # "Verify the patch" grep keeps working because strip only drops the symbol
      # table; string literals in __TEXT are preserved.
      - name: Strip main binary
        run: |
          set -euo pipefail
          BIN="macos/build/ReleaseLocal/Ghostty.app/Contents/MacOS/ghostty"
          test -f "$BIN"
          echo "--- before strip ---"
          ls -la "$BIN"
          # Only the main executable: leave Sparkle, XPC services and the plugin
          # untouched so their internal structure cannot break.
          strip "$BIN"
          echo "--- after strip ---"
          ls -la "$BIN"
      - name: Re-sign app bundle
        run: |
          set -euo pipefail
          APP="macos/build/ReleaseLocal/Ghostty.app"

          # Strip xattrs and any AppleDouble files first. codesign refuses to
          # sign a bundle carrying resource forks or Finder information with
          # "resource fork, Finder information, or similar detritus not
          # allowed". A bundle straight out of xcodebuild is clean, but this
          # makes the step safe to re-run and safe after a zip round trip.
          xattr -cr "$APP" 2>/dev/null || true
          find "$APP" -name '._*' -delete

          codesign -d --entitlements - --xml "$APP" 2>/dev/null > "$RUNNER_TEMP/ent.plist"
          plutil -lint "$RUNNER_TEMP/ent.plist"

          # Innermost first.
          for nested in \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc" \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc" \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate" \
            "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app" \
            "$APP/Contents/Frameworks/Sparkle.framework" \
            "$APP/Contents/PlugIns/DockTilePlugin.plugin"
          do
            codesign -f -s - "$nested"
          done

          # Outer bundle last, with the entitlements and the hardened runtime.
          codesign -f -s - -o runtime --entitlements "$RUNNER_TEMP/ent.plist" "$APP"

      - name: Verify signature
        # This is the check that would have caught the invalid Info.plist. If it
        # fails, the app will not launch (LaunchServices reports a null path).
        run: |
          set -euo pipefail
          APP="macos/build/ReleaseLocal/Ghostty.app"
          codesign -v --deep --strict "$APP"
          echo "signature valid"
          # An ad-hoc, un-notarized build is always "rejected" by spctl; that is
          # expected and harmless because the bundle carries no quarantine
          # attribute. Only assert that it is not the "modified" failure.
          spctl -a -t exec "$PWD/$APP" 2>&1 | tee "$RUNNER_TEMP/spctl.txt" || true
          if grep -q "plist or signature have been modified" "$RUNNER_TEMP/spctl.txt"; then
            echo "::error::bundle signature was invalidated after Info.plist stamping"
            exit 1
          fi

      - name: Verify the patch is in the binary
        # The bounded-wait log message only exists if this build actually
        # contains the patch, so a silent success here cannot be a stale or
        # unpatched binary.
        run: |
          set -euo pipefail
          BIN="macos/build/ReleaseLocal/Ghostty.app/Contents/MacOS/ghostty"
          test -f "$BIN"
          # grep straight out of the file. Do NOT use `strings | grep -q`:
          # grep -q exits on the first match and closes the pipe, so strings
          # dies with EPIPE ("failed to flush output") and, under pipefail,
          # that reports a false negative.
          if ! grep -a -q -F "rather than deadlocking" "$BIN"; then
            echo "::error::patch marker not found in $BIN - the build is NOT patched"
            exit 1
          fi
          echo "patch marker present in the built binary"
          codesign -dv --verbose=2 "$BIN" 2>&1 || true

      - name: Package app
        # ditto preserves symlinks and bundle permissions, which the Sparkle
        # framework inside the bundle relies on.
        run: |
          set -euo pipefail
          ditto -c -k --keepParent \
            macos/build/ReleaseLocal/Ghostty.app \
            Ghostty-patched-macos-arm64.zip
          ls -la Ghostty-patched-macos-arm64.zip

      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ghostty-patched-macos-arm64-${{ github.sha }}
          path: Ghostty-patched-macos-arm64.zip
          retention-days: 14
          if-no-files-found: error
